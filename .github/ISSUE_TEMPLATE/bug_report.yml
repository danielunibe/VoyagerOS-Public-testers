name: Report a problem
description: Help reproduce a VoyagerOS issue.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Share only the details needed to reproduce the issue. Do not attach folders, logs, or screenshots that expose personal information.
  - type: input
    id: version
    attributes:
      label: VoyagerOS version
      description: Use the version shown in the application or the download page.
      placeholder: Version shown in the app or release
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Edition, version, and architecture
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      description: How much does this issue affect your use?
      options:
        - Blocks evaluation
        - Major workflow affected
        - Workaround available
        - Minor or visual issue
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional evidence
      description: Remove names, paths, notifications, and other personal details before attaching a screenshot.
    validations:
      required: false
